name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/index.js
      - run: node --check src/progress.js
      - run: node --check src/audit.js
      - run: node --check src/message-events.js
      - run: node --check src/ranking.js
      - run: npm test
